services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bayesianqc
      POSTGRES_USER: bayesianqc
      POSTGRES_PASSWORD: bayesianqc
    ports:
      - "54329:5432"
    volumes:
      - bayesianqc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayesianqc -d bayesianqc"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bayesianqc-postgres:
