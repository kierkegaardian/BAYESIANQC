[project]
name = "bayesianqc"
version = "0.1.0"
description = "Bayesian-enabled laboratory quality control prototype."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.0",
  "starlette==1.3.1",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "psycopg[binary]==3.2.13",
  "sqlmodel==0.0.21",
  "uvicorn==0.30.3",
  "alembic==1.13.2",
  "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
  "httpx==0.27.2",
  "pip-audit==2.10.1",
  "pyright==1.1.408",
  "pytest==9.0.3",
  "ruff>=0.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
